                <button class="btn btn-sm net-pri-btn" id="showHideMovieModalBtn">Add Movie</button>
            </div>
        </div>
    </div>

    <!-- Movie Card -->

    <div class="container-fluid">
        <div class="row" id="movieContainer">

                <div class="card movieCard">

                    <div class="card-header d-flex justify-content-between">

        </div>
    </div>

    <!-- backdrop -->
    <div class="backdrop" id="backdrop"></div>

    <!-- movieModal -->
    <div class="movieModal" id="movieModal">
        <form id="form">
            <div class="card">

                <div class="card-header d-flex justify-content-between">
                    <h3>Add Movie</h3>
                    <i class="fa-solid fa-xmark fa-2x" id="movieModalCloseIcon"></i>
                </div>

                <div class="card-body">


                    <div class="form-group">
                        <label for="movieName">Movie Name</label>
                        <input type="text" class="form-control" id="movieName">
                    </div>

                    <div class="form-group">
                        <label for="movieImg">Movie Image</label>
                        <input type="text" class="form-control" id="movieImg">
                    </div>

                    <div class="form-group">
                        <label for="movieDescription">Movie Description</label>
                        <textarea rows="4" class="form-control" id="movieDescription"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="movieRating">Movie Rating</label>
                        <input type="number" class="form-control" id="movieRating" max="10" min="0" step="0.1">
                    </div>

                </div>

                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm net-sec-btn" id="submitBtn">Add Movie</button>
                    <button type="button" class="btn btn-sm net-sec-btn d-none" id="updateBtn">Update Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn" id="movieModalCloseBtn">Close</button>
                </div>

            </div>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
